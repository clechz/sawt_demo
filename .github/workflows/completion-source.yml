name: Completion source snapshot
on:
  push:
    branches: [fix/final-receipt-and-call-lifecycle]
    paths: [.github/workflows/completion-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/completion-source
          git archive --format=tar.gz HEAD > /tmp/completion-source/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion-source
          path: /tmp/completion-source/
          retention-days: 1
