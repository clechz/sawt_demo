name: Ash UI source review
on:
  push:
    branches: [fix/ash-clean-ui-mic-mute-20261013]
    paths: [.github/workflows/ash-ui-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/ash-ui-source
          git archive --format=tar.gz HEAD > /tmp/ash-ui-source/source.tar.gz
          git rev-parse HEAD > /tmp/ash-ui-source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ash-ui-source
          path: /tmp/ash-ui-source/
          retention-days: 1
          if-no-files-found: error
