name: Verify deployed V3 call path
on:
  workflow_dispatch:
  push:
    branches: [feat/v3-hospitality-voice]
    paths:
      - .github/workflows/verify-deployed-v3.yml
permissions:
  contents: read
concurrency:
  group: deployed-v3-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP probe dependency
        run: python -m pip install httpx==0.28.1
      - name: Install media dependencies only when authenticated verification is possible
        env:
          SAWT_DEMO_PASSWORD: ${{ secrets.SAWT_DEMO_PASSWORD }}
        run: |
          if [ -n "$SAWT_DEMO_PASSWORD" ]; then
            python -m pip install -r requirements-v2.txt
          fi
      - name: Check actual hosts, gateway and optional authenticated worker
        env:
          SAWT_DEMO_PASSWORD: ${{ secrets.SAWT_DEMO_PASSWORD }}
          SAWT_ACCESS_CODE: ${{ secrets.SAWT_ACCESS_CODE }}
        run: python scripts/verify_deployed_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-v3-verification
          path: runtime/deployment-verification/report.json
          retention-days: 7
