name: Validate voice failure cleanup repair
on:
  push:
    branches: [fix/voice-failure-cleanup-20261013]
    paths: [.github/workflows/repair-failure-cleanup.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrowly scoped source repair
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('voice_worker.py')
          original = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest() == 'acae4377f84a4c4f2bd898c1e8c9b1e2c258a6d3', 'Worker source changed; review before applying'
          source = original.decode('utf8')
          start = source.index('    async def close_failed_voice(self, message=None):')
          end = source.index('\n    def on_transcript', start)
          replacement = '''    async def close_failed_voice(self, message=None):
              # This may run inside the task that just received a provider error.
              # Cancelling that same task aborts cleanup at the next await.
              if (self.pending and self.pending is not asyncio.current_task()
                      and not self.pending.done()):
                  self.pending.cancel()
              try:
                  await asyncio.to_thread(tx.interrupt, self.sid, close=True)
                  if self.room.isconnected():
                      await self.send('error', fatal=True, code='credit_balance_exhausted' if message==CALLS_UNAVAILABLE else 'voice_unavailable', message=message or say('voice_error'))
              finally:
                  # A database, data-channel or media error must not leave a ghost call.
                  try:
                      await self.media_session.aclose()
                  finally:
                      await self.room.disconnect()
          '''
          # The embedded method uses four-space class indentation.
          lines = replacement.splitlines()
          replacement = lines[0] + '\n' + '\n'.join(line[2:] if line.startswith('  ') else line for line in lines[1:]) + '\n'
          path.write_text(source[:start] + replacement + source[end:], encoding='utf8')
          import ast
          ast.parse(path.read_text())
          PY
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v2.txt
      - run: python -m pytest -q --junitxml=cleanup-test-results.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/playback.test.mjs tests/audio-meter.test.mjs tests/call-status.test.mjs tests/call-start.test.mjs tests/experience.test.mjs
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Commit tested worker repair to development branch only
        run: |
          git add voice_worker.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prevent voice-error task from canceling its own cleanup'
          git push origin HEAD:refs/heads/fix/voice-failure-cleanup-20261013
          git rev-parse HEAD > tested-worker-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-failure-cleanup-validation
          path: |
            cleanup-test-results.xml
            tested-worker-commit.txt
          retention-days: 7
