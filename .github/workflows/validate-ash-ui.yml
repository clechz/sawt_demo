name: Validate Ash UI and microphone repair
on:
  push:
    branches: [fix/ash-clean-ui-mic-mute-20261013]
    paths: [.github/workflows/validate-ash-ui.yml, scripts/check_ash_ui_browser.py, scripts/apply_ash_ui_candidate.py, static/v2/playback.js]
permissions:
  contents: write
concurrency:
  group: validate-ash-ui
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply explicit candidate changes on this development branch
        run: python3 scripts/apply_ash_ui_candidate.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v2.txt
      - name: Check native controls exist in the pinned installed plugin
        run: |
          python - <<'PY'
          import importlib
          m = importlib.import_module('livekit.plugins.openai.realtime.gpt_live_model')
          assert any(isinstance(obj, type) and callable(getattr(obj, 'mute_input', None)) and callable(getattr(obj, 'unmute_input', None)) for obj in vars(m).values())
          print('Pinned GPT-Live plugin exposes native input-only mute and unmute.')
          PY
      - name: Full Python regressions
        run: python -m pytest -q --junitxml=/tmp/ash-ui-python.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All browser-logic regressions
        run: node --experimental-default-type=module --test tests/*.test.mjs | tee /tmp/ash-ui-js.txt
      - name: Frontend production build
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Install isolated UI browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Desktop/mobile UI and mute button interaction tests with mocked transport
        run: python scripts/check_ash_ui_browser.py
      - name: Publish tested application source on development branch only
        run: |
          git restore --worktree .github/workflows
          git add sawt static/v2 tests scripts/check_ash_ui_browser.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Default to Ash, simplify caller UI and decouple microphone mute from agent speech'
          git push origin HEAD:refs/heads/fix/ash-clean-ui-mic-mute-20261013
          git rev-parse HEAD > /tmp/ash-ui-tested-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ash-ui-validation
          path: |
            /tmp/ash-ui-python.xml
            /tmp/ash-ui-js.txt
            /tmp/ash-ui-tested-commit.txt
            /tmp/sawt-ash-ui-evidence/
          retention-days: 7
