name: V3 reproducible source snapshot
on:
  push:
    branches: [feat/v3-hospitality-voice]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: |
          git archive --format=tar --prefix=sawt_demo/ HEAD > sawt-source.tar
          sha256sum sawt-source.tar > sawt-source.sha256
          git rev-parse HEAD > sawt-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v3-source-snapshot
          path: |
            sawt-source.tar
            sawt-source.sha256
            sawt-source-commit.txt
          retention-days: 1
