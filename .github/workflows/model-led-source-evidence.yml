name: Model-led source evidence
on:
  push:
    branches: [feat/model-led-conversation-20261013]
    paths: [.github/workflows/model-led-source-evidence.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/model-led-source
          git rev-parse HEAD > /tmp/model-led-source/commit.txt
          git archive --format=tar.gz HEAD > /tmp/model-led-source/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-led-source
          path: /tmp/model-led-source/
          retention-days: 1
          if-no-files-found: error
