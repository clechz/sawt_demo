<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAWT diagnostics</title><style>body{font:14px system-ui;background:#f7f5ef;color:#203a32;margin:30px}header{display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d9dfd3;padding:20px;border-radius:12px;max-height:75vh;overflow:auto}a{color:inherit}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><header><h1>SAWT / diagnostics</h1><a href="/">Open caller experience</a></header><p id="status">Start a call in this browser first. This view reads the same persisted state as the voice worker.</p><main><section><h2>Authoritative state</h2><pre id="state"></pre></section><section><h2>Event timeline</h2><pre id="events"></pre></section></main><script type="module">let after=0,events=[],current;async function update(){const call=JSON.parse(localStorage.getItem('sawt-debug-call')||'null');if(!call)return;if(current!==call.id){current=call.id;after=0;events=[];}try{const r=await fetch(`/api/calls/${call.id}?after=${after}`,{headers:{Authorization:`Bearer ${call.token}`}});if(!r.ok)throw Error('Session unavailable');const data=await r.json();events.push(...data.events);events=events.slice(-200);after=events.at(-1)?.sequence||after;document.getElementById('status').textContent=`Session ${call.id} · epoch ${data.epoch} · ${data.closed?'closed':'active'} · mock restaurant`;document.getElementById('state').textContent=JSON.stringify(data.state,null,2);document.getElementById('events').textContent=events.map(e=>`${new Date(e.at*1000).toISOString()} ${e.kind}\n${JSON.stringify(e.payload,null,2)}`).reverse().join('\n\n');}catch(e){document.getElementById('status').textContent=e.message;}}setInterval(update,1000);update();</script></body></html>
